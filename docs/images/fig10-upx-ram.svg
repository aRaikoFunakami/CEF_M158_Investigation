"186" font-size="12" text-anchor="start" fill="#202124">PSS 757.7(A 590.3 + B 167.3)</text><rect x="250" y="196" width="251.28599999999997" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="509.28599999999994" y="208" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 598.3</text><text x="238" y="248" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版 + UPX</text><rect x="250" y="224" width="359.09999999999997" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="609.0999999999999" y="224" width="13.65" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="630.75" y="240" font-size="12" text-anchor="start" fill="#202124">PSS 887.6(A 855.0 + B 32.5)</text><rect x="250" y="250" width="573.804" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="831.804" y="262" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 1,366.2</text><text x="30" y="302" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">3 フラグ</text><text x="238" y="336" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250" y="312" width="277.494" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="527.494" y="312" width="105.588" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="641.082" y="328" font-size="12" text-anchor="start" fill="#202124">PSS 912.2(A 660.7 + B 251.4)</text><rect x="250" y="338" width="277.998" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="535.998" y="350" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 661.9</text><text x="238" y="390" font-size="14" text-anchor="end" fill="#202124">削減版</text><rect x="250" y="366" width="222.13799999999998" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="472.138" y="366" width="69.38399999999999" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="549.5219999999999" y="382" font-size="12" text-anchor="start" fill="#202124">PSS 694.0(A 528.9 + B 165.2)</text><rect x="250" y="392" width="225.834" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="483.834" y="404" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 537.7</text><text x="238" y="444" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版 + UPX</text><rect x="250" y="420" width="272.832" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="522.832" y="420" width="13.398" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="544.23" y="436" font-size="12" text-anchor="start" fill="#202124">PSS 681.5(A 649.6 + B 31.9)</text><rect x="250" y="446" width="285.18" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="543.1800000000001" y="458" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 679.0</text><text x="30" y="494" font-size="11.5" text-anchor="start" fill="#5f6368">UPX では、展開したコードのうちプロセスが触っていない部分が cgroup にだけ入るので、cgroup が PSS を超える。</text><text x="30" y="514" font-size="11.5" text-anchor="start" fill="#5f6368">最後まで再生できた 2 回の中央値。CEF 既定は SwiftShader で描画、削減版の 3 フラグは --disable-gpu。</text></svg>