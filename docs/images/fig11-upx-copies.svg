<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="505" fill="#fff"/><text x="30" y="36" font-size="19" text-anchor="start" fill="#202124" font-weight="bold">UPX 版で libcef.so の展開コピーがいくつ作られるか(起動直後、arm64、削減版)</text><text x="30" y="62" font-size="12.5" text-anchor="start" fill="#5f6368">赤枠 = 自分で起動し直す(execve)ので、自分専用の展開コピー(約 153MiB、カーネルが捨てられない)を作るプロセス。灰色 = fork で作られ、親のコピーを共有する</text><text x="265" y="98" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">起動フラグなし: 8 プロセス、コピー 4 個 → +613MiB</text><rect x="175" y="116" width="180" height="46" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="265.0" y="136" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">ブラウザ</text><text x="265.0" y="154" font-size="11.5" text-anchor="middle" fill="#5f6368">execve(cefsimple)</text><rect x="285" y="103" width="82" height="22" rx="11" fill="#d93025" stroke="none" stroke-width="1"/><text x="326" y="119" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">コピー 1</text><line x1="265" y1="162" x2="100" y2="206" stroke="#5f6368" stroke-width="1.5"/><rect x="20" y="206" width="160" height="46" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="100.0" y="226" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">zygote 1</text><text x="100.0" y="244" font-size="11.5" text-anchor="middle" fill="#5f6368">サンドボックスなし・execve</text><rect x="110" y="193" width="82" height="22" rx="11" fill="#d93025" stroke="none" stroke-width="1"/><text x="151" y="209" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">コピー 2</text><line x1="265" y1="162" x2="270" y2="206" stroke="#5f6368" stroke-width="1.5"/><rect x="190" y="206" width="160" height="46" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="270.0" y="226" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">zygote 2</text><text x="270.0" y="244" font-size="11.5" text-anchor="middle" fill="#5f6368">サンドボックスあり・execve</text><rect x="280" y="193" width="82" height="22" rx="11" fill="#d93025" stroke="none" stroke-width="1"/><text x="321" y="209" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">コピー 3</text><line x1="265" y1="162" x2="440" y2="206" stroke="#5f6368" stroke-width="1.5"/><rect x="360" y="206" width="160" height="46" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="440.0" y="226" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">ネットワーク</text><text x="440.0" y="244" font-size="11.5" text-anchor="middle" fill="#5f6368">サービス・execve</text><rect x="450" y="193" width="82" height="22" rx="11" fill="#d93025" stroke="none" stroke-width="1"/><text x="491" y="209" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">コピー 4</text><line x1="100" y1="252" x2="100" y2="300" stroke="#5f6368" stroke-width="1.5"/><rect x="20" y="300" width="160" height="46" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="100.0" y="320" font-size="14" text-anchor="middle" fill="#202124">GPU</text><text x="100.0" y="338" font-size="11.5" text-anchor="middle" fill="#5f6368">fork(コピー 2 を共有)</text><line x1="205" y1="252" x2="205" y2="439" stroke="#5f6368" stroke-width="1.5"/><line x1="205" y1="323" x2="220" y2="323" stroke="#5f6368" stroke-width="1.5"/><rect x="220" y="300" width="160" height="46" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="300.0" y="320" font-size="14" text-anchor="middle" fill="#202124">レンダラ</text><text x="300.0" y="338" font-size="11.5" text-anchor="middle" fill="#5f6368">fork(コピー 3 を共有)</text><line x1="205" y1="381" x2="220" y2="381" stroke="#5f6368" stroke-width="1.5"/><rect x="220" y="358" width="160" height="46" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="300.0" y="378" font-size="14" text-anchor="middle" fill="#202124">レンダラ</text><text x="300.0" y="396" font-size="11.5" text-anchor="middle" fill="#5f6368">fork(コピー 3 を共有)</text><line x1="205" y1="439" x2="220" y2="439" stroke="#5f6368" stroke-width="1.5"/><rect x="220" y="416" width="160" height="46" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="300.0" y="436" font-size="14" text-anchor="middle" fill="#202124">ストレージ</text><text x="300.0" y="454" font-size="11.5" text-anchor="middle" fill="#5f6368">fork(コピー 3 を共有)</text><line x1="530" y1="90" x2="530" y2="480" stroke="#dadce0" stroke-width="1"/><text x="760" y="98" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">3 フラグ: 1 プロセス、コピー 1 個 → +153MiB</text><rect x="600" y="116" width="330" height="200" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><rect x="860" y="103" width="82" height="22" rx="11" fill="#d93025" stroke="none" stroke-width="1"/><text x="901" y="119" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">コピー 1</text><text x="765" y="142" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">ブラウザ(execve)</text><rect x="630" y="158" width="270" height="30" rx="5" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="765" y="178" font-size="13" text-anchor="middle" fill="#202124">ブラウザの処理</text><rect x="630" y="195" width="270" height="30" rx="5" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="765" y="215" font-size="13" text-anchor="middle" fill="#202124">レンダラ(スレッド)</text><rect x="630" y="232" width="270" height="30" rx="5" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="765" y="252" font-size="13" text-anchor="middle" fill="#202124">GPU(スレッド)</text><rect x="630" y="269" width="270" height="30" rx="5" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="765" y="289" font-size="13" text-anchor="middle" fill="#202124">ネットワーク・ストレージ(スレッド)</text><text x="765" y="345" font-size="12.5" text-anchor="middle" fill="#5f6368">--single-process: 全部を 1 プロセスのスレッドにする</text><text x="765" y="365" font-size="12.5" text-anchor="middle" fill="#5f6368">--no-zygote: zygote を起動しない</text><text x="30" y="490" font-size="12" text-anchor="start" fill="#5f6368">/proc/&lt;pid&gt;/maps の memfd:upx の inode を数えた。cgroup の shmem は、フラグなしで +613.4MiB(4 個)、3 フラグで +153.3MiB(1 個)増えた。</text></svg>