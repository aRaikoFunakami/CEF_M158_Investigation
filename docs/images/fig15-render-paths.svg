<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="718" viewBox="0 0 1000 718" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="718" fill="#fff"/><text x="30" y="36" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">Chromium の描画の経路: GPU、SwiftShader、ソフトウェア合成</text><text x="30" y="60" font-size="12.5" text-anchor="start" fill="#5f6368">ページの絵(タイル)を描く処理は、今回の 3 つの環境ではどれも CPU(Skia)。違いは、絵や動画を 1 枚の画面にまとめる「合成」と、WebGL の行き先。</text><rect x="30" y="78" width="300" height="560" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="180.0" y="104" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">① GPU あり(実機)</text><rect x="50" y="120" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="180.0" y="147.0" font-size="14" text-anchor="middle" fill="#202124">Blink(ページの内容)</text><line x1="180.0" y1="164" x2="180.0" y2="176" stroke="#5f6368" stroke-width="1.5"/><path d="M175.0,174 L185.0,174 L180.0,182 z" fill="#5f6368"/><rect x="50" y="182" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="180.0" y="201.0" font-size="14" text-anchor="middle" fill="#202124">ページの絵を描く(ラスタ)</text><text x="180.0" y="219.0" font-size="11.5" text-anchor="middle" fill="#5f6368">Skia。GPU でも描ける</text><line x1="180.0" y1="226" x2="180.0" y2="238" stroke="#5f6368" stroke-width="1.5"/><path d="M175.0,236 L185.0,236 L180.0,244 z" fill="#5f6368"/><rect x="50" y="244" width="260" height="44" rx="6" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="180.0" y="263.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">合成(GPU 合成)</text><text x="180.0" y="281.0" font-size="11.5" text-anchor="middle" fill="#5f6368">Skia が GLES を呼ぶ</text><line x1="180.0" y1="288" x2="180.0" y2="300" stroke="#5f6368" stroke-width="1.5"/><path d="M175.0,298 L185.0,298 L180.0,306 z" fill="#5f6368"/><rect x="50" y="306" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="180.0" y="325.0" font-size="14" text-anchor="middle" fill="#202124">ANGLE</text><text x="180.0" y="343.0" font-size="11.5" text-anchor="middle" fill="#5f6368">GLES を下の API に翻訳</text><line x1="180.0" y1="350" x2="180.0" y2="362" stroke="#5f6368" stroke-width="1.5"/><path d="M175.0,360 L185.0,360 L180.0,368 z" fill="#5f6368"/><rect x="50" y="368" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="180.0" y="387.0" font-size="14" text-anchor="middle" fill="#202124">GPU ドライバ</text><text x="180.0" y="405.0" font-size="11.5" text-anchor="middle" fill="#5f6368">機器ベンダーの GLES / Vulkan</text><line x1="180.0" y1="412" x2="180.0" y2="424" stroke="#5f6368" stroke-width="1.5"/><path d="M175.0,422 L185.0,422 L180.0,430 z" fill="#5f6368"/><rect x="50" y="430" width="260" height="44" rx="6" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="180.0" y="457.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">GPU(ハードウェア)</text><line x1="180.0" y1="474" x2="180.0" y2="486" stroke="#5f6368" stroke-width="1.5"/><path d="M175.0,484 L185.0,484 L180.0,492 z" fill="#5f6368"/><rect x="50" y="492" width="260" height="36" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="180.0" y="515.0" font-size="14" text-anchor="middle" fill="#202124">画面</text><text x="180.0" y="556" font-size="13" text-anchor="middle" fill="#202124" font-weight="bold">WebGL ○</text><text x="180.0" y="578" font-size="13" text-anchor="middle" fill="#202124">GPU 合成 ○</text><text x="180.0" y="600" font-size="13" text-anchor="middle" fill="#202124">今回は未計測</text><rect x="350" y="78" width="300" height="560" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/><text x="500.0" y="104" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">② GPU なし、SwiftShader あり</text><rect x="370" y="120" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="500.0" y="147.0" font-size="14" text-anchor="middle" fill="#202124">Blink(ページの内容)</text><line x1="500.0" y1="164" x2="500.0" y2="176" stroke="#5f6368" stroke-width="1.5"/><path d="M495.0,174 L505.0,174 L500.0,182 z" fill="#5f6368"/><rect x="370" y="182" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="500.0" y="201.0" font-size="14" text-anchor="middle" fill="#202124">ページの絵を描く(ラスタ)</text><text x="500.0" y="219.0" font-size="11.5" text-anchor="middle" fill="#5f6368">Skia が CPU で描く</text><line x1="500.0" y1="226" x2="500.0" y2="238" stroke="#5f6368" stroke-width="1.5"/><path d="M495.0,236 L505.0,236 L500.0,244 z" fill="#5f6368"/><rect x="370" y="244" width="260" height="44" rx="6" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="500.0" y="263.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">合成(GPU 合成)</text><text x="500.0" y="281.0" font-size="11.5" text-anchor="middle" fill="#5f6368">Skia が GLES を呼ぶ</text><line x1="500.0" y1="288" x2="500.0" y2="300" stroke="#5f6368" stroke-width="1.5"/><path d="M495.0,298 L505.0,298 L500.0,306 z" fill="#5f6368"/><rect x="370" y="306" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="500.0" y="325.0" font-size="14" text-anchor="middle" fill="#202124">ANGLE</text><text x="500.0" y="343.0" font-size="11.5" text-anchor="middle" fill="#5f6368">GLES を下の API に翻訳</text><line x1="500.0" y1="350" x2="500.0" y2="362" stroke="#5f6368" stroke-width="1.5"/><path d="M495.0,360 L505.0,360 L500.0,368 z" fill="#5f6368"/><rect x="370" y="368" width="260" height="44" rx="6" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="500.0" y="387.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">SwiftShader</text><text x="500.0" y="405.0" font-size="11.5" text-anchor="middle" fill="#5f6368">GPU のふりをする CPU のプログラム</text><line x1="500.0" y1="412" x2="500.0" y2="424" stroke="#5f6368" stroke-width="1.5"/><path d="M495.0,422 L505.0,422 L500.0,430 z" fill="#5f6368"/><rect x="370" y="430" width="260" height="44" rx="6" fill="#fff" stroke="#9aa0a6" stroke-width="2"/><text x="500.0" y="457.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">CPU</text><line x1="500.0" y1="474" x2="500.0" y2="486" stroke="#5f6368" stroke-width="1.5"/><path d="M495.0,484 L505.0,484 L500.0,492 z" fill="#5f6368"/><rect x="370" y="492" width="260" height="36" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="500.0" y="515.0" font-size="14" text-anchor="middle" fill="#202124">画面</text><text x="500.0" y="556" font-size="13" text-anchor="middle" fill="#202124" font-weight="bold">WebGL ○(CPU で動くので遅い)</text><text x="500.0" y="578" font-size="13" text-anchor="middle" fill="#202124">GPU 合成 ○(実体は CPU)</text><text x="500.0" y="600" font-size="13" text-anchor="middle" fill="#202124">削減版: 1080p60 でコマ落ち 約 3 割</text><rect x="670" y="78" width="300" height="560" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"/><text x="820.0" y="104" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">③ GPU なし、SwiftShader なし</text><rect x="690" y="120" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="820.0" y="147.0" font-size="14" text-anchor="middle" fill="#202124">Blink(ページの内容)</text><line x1="820.0" y1="164" x2="820.0" y2="176" stroke="#5f6368" stroke-width="1.5"/><path d="M815.0,174 L825.0,174 L820.0,182 z" fill="#5f6368"/><rect x="690" y="182" width="260" height="44" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="820.0" y="201.0" font-size="14" text-anchor="middle" fill="#202124">ページの絵を描く(ラスタ)</text><text x="820.0" y="219.0" font-size="11.5" text-anchor="middle" fill="#5f6368">Skia が CPU で描く</text><line x1="820.0" y1="226" x2="820.0" y2="238" stroke="#5f6368" stroke-width="1.5"/><path d="M815.0,236 L825.0,236 L820.0,244 z" fill="#5f6368"/><rect x="690" y="244" width="260" height="44" rx="6" fill="#fff" stroke="#d93025" stroke-width="2"/><text x="820.0" y="263.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">合成(ソフトウェア合成)</text><text x="820.0" y="281.0" font-size="11.5" text-anchor="middle" fill="#5f6368">Skia が CPU で直接まとめる</text><line x1="730" y1="288" x2="730" y2="424" stroke="#5f6368" stroke-width="1.5"/><path d="M725,422 L735,422 L730,430 z" fill="#5f6368"/><text x="750" y="340" font-size="12.5" text-anchor="start" fill="#5f6368">GLES、ANGLE、GPU ドライバ、</text><text x="750" y="360" font-size="12.5" text-anchor="start" fill="#5f6368">SwiftShader を通らない</text><text x="750" y="380" font-size="12.5" text-anchor="start" fill="#5f6368">(GL を無効にする)</text><line x1="730" y1="474" x2="730" y2="474" stroke="#5f6368" stroke-width="1.5"/><rect x="690" y="430" width="260" height="44" rx="6" fill="#fff" stroke="#9aa0a6" stroke-width="2"/><text x="820.0" y="457.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">CPU</text><line x1="820.0" y1="474" x2="820.0" y2="486" stroke="#5f6368" stroke-width="1.5"/><path d="M815.0,484 L825.0,484 L820.0,492 z" fill="#5f6368"/><rect x="690" y="492" width="260" height="36" rx="6" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="820.0" y="515.0" font-size="14" text-anchor="middle" fill="#202124">画面</text><text x="820.0" y="556" font-size="13" text-anchor="middle" fill="#202124" font-weight="bold">WebGL ×</text><text x="820.0" y="578" font-size="13" text-anchor="middle" fill="#202124">GPU 合成 ×(ソフトウェア合成)</text><text x="820.0" y="600" font-size="13" text-anchor="middle" fill="#202124">削減版: 1080p60 でコマ落ち 0</text><text x="30" y="662" font-size="11.5" text-anchor="start" fill="#5f6368">CEF 既定は②、今回の「削減版、SwiftShader なし」は③。②と③の WebGL、GPU 合成の状態は SystemInfo.getInfo の featureStatus(logs/515b)。</text><text x="30" y="682" font-size="11.5" text-anchor="start" fill="#5f6368">コマ落ちは YouTube 1080p60、AV1、ソフトウェアデコード、マルチプロセス(logs/421、422)。①は実機で確かめていない。</text><text x="30" y="702" font-size="11.5" text-anchor="start" fill="#5f6368">GPU がない、または初期化に失敗すると、マルチプロセスでは ②(SwiftShader があれば)か ③ に切り替わる。--single-process では切り替えられない。</text></svg>