<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="480" fill="#fff"/><text x="30" y="38" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">UPX で圧縮すると、展開したコードが「回収できない RAM」になる</text><text x="255" y="80" font-size="17" text-anchor="middle" fill="#202124" font-weight="bold">圧縮前</text><text x="745" y="80" font-size="17" text-anchor="middle" fill="#202124" font-weight="bold">UPX で圧縮(libcef.so を 186MB → 86MB)</text><rect x="60" y="100" width="390" height="50" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="255" y="131" font-size="14" text-anchor="middle" fill="#202124">ディスク上の libcef.so(186MB)</text><rect x="60" y="180" width="390" height="70" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/><text x="255" y="210" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">ページキャッシュ(ファイル由来の RAM)</text><text x="255" y="232" font-size="12" text-anchor="middle" fill="#5f6368">全プロセスで共有。足りなくなれば捨てて読み直せる</text><rect x="60" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="105" y="315" font-size="12.5" text-anchor="middle" fill="#202124">ブラウザ</text><line x1="105" y1="290" x2="105" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="160" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="205" y="315" font-size="12.5" text-anchor="middle" fill="#202124">GPU</text><line x1="205" y1="290" x2="205" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="260" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="305" y="315" font-size="11.5" text-anchor="middle" fill="#202124">ユーティリティ</text><line x1="305" y1="290" x2="305" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="360" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="405" y="315" font-size="12.5" text-anchor="middle" fill="#202124">レンダラ</text><line x1="405" y1="290" x2="405" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="550" y="100" width="390" height="50" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="745" y="131" font-size="14" text-anchor="middle" fill="#202124">ディスク上の libcef.so(86MB、圧縮済み)</text><rect x="550" y="180" width="90" height="70" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1"/><text x="595" y="205" font-size="11.5" text-anchor="middle" fill="#202124">展開した</text><text x="595" y="222" font-size="11.5" text-anchor="middle" fill="#202124">コード</text><text x="595" y="239" font-size="11" text-anchor="middle" fill="#5f6368">(memfd)</text><rect x="550" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="595" y="315" font-size="12.5" text-anchor="middle" fill="#202124">ブラウザ</text><line x1="595" y1="290" x2="595" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="650" y="180" width="90" height="70" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1"/><text x="695" y="205" font-size="11.5" text-anchor="middle" fill="#202124">展開した</text><text x="695" y="222" font-size="11.5" text-anchor="middle" fill="#202124">コード</text><text x="695" y="239" font-size="11" text-anchor="middle" fill="#5f6368">(memfd)</text><rect x="650" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="695" y="315" font-size="11.5" text-anchor="middle" fill="#202124">zygote</text><line x1="695" y1="290" x2="695" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="750" y="180" width="90" height="70" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1"/><text x="795" y="205" font-size="11.5" text-anchor="middle" fill="#202124">展開した</text><text x="795" y="222" font-size="11.5" text-anchor="middle" fill="#202124">コード</text><text x="795" y="239" font-size="11" text-anchor="middle" fill="#5f6368">(memfd)</text><rect x="750" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="795" y="315" font-size="12.5" text-anchor="middle" fill="#202124">GPU</text><line x1="795" y1="290" x2="795" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="850" y="180" width="90" height="70" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1"/><text x="895" y="205" font-size="11.5" text-anchor="middle" fill="#202124">展開した</text><text x="895" y="222" font-size="11.5" text-anchor="middle" fill="#202124">コード</text><text x="895" y="239" font-size="11" text-anchor="middle" fill="#5f6368">(memfd)</text><rect x="850" y="290" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="895" y="315" font-size="11.5" text-anchor="middle" fill="#202124">ユーティリティ</text><line x1="895" y1="290" x2="895" y2="252" stroke="#5f6368" stroke-width="1.5"/><rect x="750" y="350" width="90" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="795" y="375" font-size="12.5" text-anchor="middle" fill="#202124">レンダラ</text><line x1="695" y1="330" x2="790" y2="350" stroke="#5f6368" stroke-dasharray="4 3"/><text x="850" y="375" font-size="12" text-anchor="start" fill="#5f6368">← zygote から複製</text><text x="745" y="420" font-size="12.5" text-anchor="middle" fill="#5f6368">起動されたプロセスごとに、読み込み時に共有メモリ(memfd)へ展開する。</text><text x="745" y="440" font-size="12.5" text-anchor="middle" fill="#5f6368">ディスクに元がないので、カーネルは捨てられない。</text><text x="255" y="420" font-size="12.5" text-anchor="middle" fill="#5f6368">コードはファイルから読み込まれ、</text><text x="255" y="440" font-size="12.5" text-anchor="middle" fill="#5f6368">使われた分だけがメモリに載る。</text></svg>