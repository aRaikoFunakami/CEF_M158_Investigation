ont-size="12" text-anchor="start" fill="#202124">PSS 912.2(A 660.7 + B 251.4)</text><rect x="260" y="610" width="291.236" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="559.236" y="622" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 661.9</text><text x="248" y="662" font-size="13.5" text-anchor="end" fill="#202124">削減版、3 フラグ</text><rect x="260" y="638" width="232.71599999999998" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="492.716" y="638" width="72.688" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="573.404" y="654" font-size="12" text-anchor="start" fill="#202124">PSS 694.0(A 528.9 + B 165.2)</text><rect x="260" y="664" width="236.58800000000002" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="504.588" y="676" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 537.7</text><text x="248" y="716" font-size="13.5" text-anchor="end" fill="#202124" font-weight="bold">削減版 + UPX、3 フラグ</text><rect x="260" y="692" width="285.824" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="545.8240000000001" y="692" width="14.036" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="567.86" y="708" font-size="12" text-anchor="start" fill="#202124">PSS 681.5(A 649.6 + B 31.9)</text><rect x="260" y="718" width="298.76" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="566.76" y="730" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 679.0</text><text x="30" y="766" font-size="11.5" text-anchor="start" fill="#5f6368">3 フラグの再生中の cgroup は、ROM の削減で 661.9 → 537.7 に減り、UPX で 679.0 に戻る。ROM は 366.3 → 196.0 → 95.3MB。</text><text x="30" y="786" font-size="11.5" text-anchor="start" fill="#5f6368">削減版は UPX 用の 2 つの変更を入れた圧縮前。CEF 既定は SwiftShader で描画(再生中)、3 フラグの起動直後と削減版は --disable-gpu。</text></svg>