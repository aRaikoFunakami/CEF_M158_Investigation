l="#a50e0e" font-weight="bold">cgroup 679.0</text><text x="30" y="628" font-size="11.5" text-anchor="start" fill="#5f6368">ROM は 26% になる。再生中の cgroup は CEF 既定(3 フラグ)とほぼ同じ(661.9 → 679.0)で、PSS と cgroup + B は小さい。</text><text x="30" y="648" font-size="11.5" text-anchor="start" fill="#5f6368">起動直後は UPX の展開コピー(約 153MiB)の分だけ cgroup が大きい。CEF 既定は SwiftShader で描画(再生中)、3 フラグの起動直後は --disable-gpu。</text></svg>