<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="395" fill="#fff"/><text x="30" y="36" font-size="19" text-anchor="start" fill="#202124" font-weight="bold">UPX で増える回収できない RAM: 参考記事の Chromium と今回の CEF(arm64、単位 MiB)</text><rect x="360" y="52" width="14" height="14" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="380" y="64" font-size="13" text-anchor="start" fill="#5f6368">参考記事: Chromium 156(実行ファイル 294MiB)</text><rect x="690" y="52" width="14" height="14" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="710" y="64" font-size="13" text-anchor="start" fill="#5f6368">今回: 削減版 CEF(libcef.so 186.2MB)</text><text x="348" y="134" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">起動フラグなし(コピー 4 個)</text><rect x="360" y="100" width="562.0" height="28" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="930.0" y="119" font-size="13" text-anchor="start" fill="#202124">+1,124</text><rect x="360" y="134" width="306.5" height="28" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="674.5" y="153" font-size="13" text-anchor="start" fill="#202124" font-weight="bold">+613</text><text x="348" y="244" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">--single-process --no-zygote(コピー 1 個)</text><rect x="360" y="210" width="141.5" height="28" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="509.5" y="229" font-size="13" text-anchor="start" fill="#202124">+283</text><rect x="360" y="244" width="76.5" height="28" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="444.5" y="263" font-size="13" text-anchor="start" fill="#202124" font-weight="bold">+153</text><text x="30" y="330" font-size="13" text-anchor="start" fill="#202124">1 コピーあたり: 参考記事 約 282MiB(コード 約 238MiB + 読み取り専用データの複製 約 45MiB)、今回 約 153MiB(コードと読み取り専用データ)。</text><text x="30" y="352" font-size="13" text-anchor="start" fill="#202124">別起動のプロセスの数(4 個)はどちらも同じ。差はコピー 1 個の大きさで決まっている。</text><text x="30" y="380" font-size="11.5" text-anchor="start" fill="#5f6368">参考記事の値は https://qiita.com/rairaii/items/d5a5c3da56dbc7063a19(arm64、1 タブ、cgroup の anon + shmem の増加)。</text></svg>