<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="470" fill="#fff"/><text x="30" y="38" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">メモリの上限をかけて 120 秒再生できた上限値(起動フラグあり、単位 MiB)</text><rect x="30" y="56" width="14" height="14" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="50" y="68" font-size="13" text-anchor="start" fill="#3c4043">CEF 既定</text><rect x="160" y="56" width="14" height="14" rx="0" fill="#1a73e8" stroke="none" stroke-width="1"/><text x="180" y="68" font-size="13" text-anchor="start" fill="#3c4043">削減版(SwiftShader なし)</text><rect x="420" y="56" width="14" height="14" rx="0" fill="#fce8e6" stroke="#d93025" stroke-width="1"/><text x="440" y="68" font-size="13" text-anchor="start" fill="#3c4043">強制終了された上限</text><line x1="80" y1="380.0" x2="960" y2="380.0" stroke="#e8eaed"/><text x="72" y="384.0" font-size="12" text-anchor="end" fill="#5f6368">0</text><line x1="80" y1="300.0" x2="960" y2="300.0" stroke="#e8eaed"/><text x="72" y="304.0" font-size="12" text-anchor="end" fill="#5f6368">400</text><line x1="80" y1="220.0" x2="960" y2="220.0" stroke="#e8eaed"/><text x="72" y="224.0" font-size="12" text-anchor="end" fill="#5f6368">800</text><line x1="80" y1="140.0" x2="960" y2="140.0" stroke="#e8eaed"/><text x="72" y="144.0" font-size="12" text-anchor="end" fill="#5f6368">1200</text><rect x="150" y="224.0" width="80" height="156.0" rx="0" fill="#fce8e6" stroke="#d93025" stroke-width="1"/><text x="190" y="216.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">780</text><text x="190" y="400" font-size="12" text-anchor="middle" fill="#5f6368">強制終了</text><rect x="250" y="204.0" width="80" height="176.0" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="290" y="196.0" font-size="14" text-anchor="middle" fill="#202124" font-weight="bold">880</text><text x="290" y="400" 