" font-size="12" text-anchor="start" fill="#202124">PSS 286.7(A 127.5 + B 159.4)</text><rect x="250" y="196" width="109.48" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="367.48" y="208" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 128.8</text><text x="238" y="248" font-size="14" text-anchor="end" fill="#202124">削減版、SwiftShader なし</text><rect x="250" y="224" width="79.72999999999999" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="329.73" y="224" width="119.85" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="457.58000000000004" y="240" font-size="12" text-anchor="start" fill="#202124">PSS 234.7(A 93.8 + B 141.0)</text><rect x="250" y="250" width="86.53" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="344.53" y="262" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 101.8</text><text x="238" y="302" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版、SwiftShader なし + UPX</text><rect x="250" y="278" width="262.98999999999995" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="512.99" y="278" width="23.035" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="544.025" y="294" font-size="12" text-anchor="start" fill="#202124">PSS 336.5(A 309.4 + B 27.1)</text><rect x="250" y="304" width="608.0899999999999" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="866.0899999999999" y="316" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 715.4</text><text x="30" y="356" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">3 フラグ(--disable-gpu 付き)</text><text x="238" y="390" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250" y="366" width="49.3" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="299.3" y="366" width="176.97" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="484.27" y="382" font-size="12" text-anchor="start" fill="#202124">PSS 266.1(A 58.0 + B 208.2)</text><rect x="250" y="392" width="55.845" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="313.845" y="404" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 65.7</text><text x="238" y="444" font-size="14" text-anchor="end" fill="#202124">削減版、SwiftShader なし</text><rect x="250" y="420" width="41.48" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="291.48" y="420" width="118.74499999999999" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="418.225" y="436" font-size="12" text-anchor="start" fill="#202124">PSS 188.5(A 48.8 + B 139.7)</text><rect x="250" y="446" width="48.195" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="306.195" y="458" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 56.7</text><text x="238" y="498" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版、SwiftShader なし + UPX</text><rect x="250" y="474" width="138.465" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="388.46500000000003" y="474" width="21.76" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="418.225" y="490" font-size="12" text-anchor="start" fill="#202124">PSS 188.5(A 162.9 + B 25.6)</text><rect x="250" y="500" width="178.5" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="436.5" y="512" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 210.0</text><text x="30" y="548" font-size="11.5" text-anchor="start" fill="#5f6368">PSS = A + B(smaps_rollup。中央値を別々に取るので 0.3MiB ほどずれる)。cgroup は memory.stat の anon + shmem で、どのプロセスも触っていないページも含む。</text><text x="30" y="568" font-size="11.5" text-anchor="start" fill="#5f6368">8 CPU / 8GB の arm64 コンテナ、3 回の中央値。logs/428、483、514。</text></svg>