<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378" viewBox="0 0 1000 378" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="378" fill="#fff"/><text x="30" y="38" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">起動直後の RAM(arm64、起動フラグなし、テストページを開いて 30 秒後、単位 MiB)</text><rect x="160" y="56" width="14" height="14" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="180" y="68" font-size="13" text-anchor="start" fill="#5f6368">A: 回収できない分のうちプロセスが触ったページ</text><rect x="530" y="56" width="14" height="14" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="550" y="68" font-size="13" text-anchor="start" fill="#5f6368">B: ファイル由来</text><rect x="690" y="56" width="14" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="710" y="68" font-size="13" text-anchor="start" fill="#5f6368">回収できない RAM(cgroup)</text><text x="238" y="116" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250" y="92" width="135.32" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="385.32" y="92" width="194.39499999999998" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="587.7149999999999" y="108" font-size="12" text-anchor="start" fill="#202124">PSS 387.6(A 159.2 + B 228.7)</text><rect x="250" y="118" width="136.42499999999998" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="394.42499999999995" y="130" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 160.5</text><text x="238" y="170" font-size="14" text-anchor="end" fill="#202124">削減版</text><rect x="250" y="146" width="108.375" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="358.375" y="146" width="135.49" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="501.865" y="162" font-size="12" text-anchor="start" fill="#202124">PSS 286.7(A 127.5 + B 159.4)</text><rect x="250" y="172" width="109.48" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="367.48" y="184" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 128.8</text><text x="238" y="224" font-size="14" text-anchor="end" fill="#202124">削減版、SwiftShader なし</text><rect x="250" y="200" width="79.72999999999999" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="329.73" y="200" width="119.85" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="457.58000000000004" y="216" font-size="12" text-anchor="start" fill="#202124">PSS 234.7(A 93.8 + B 141.0)</text><rect x="250" y="226" width="86.53" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="344.53" y="238" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 101.8</text><text x="238" y="278" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版、SwiftShader なし + UPX</text><rect x="250" y="254" width="262.98999999999995" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="512.99" y="254" width="23.035" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="544.025" y="270" font-size="12" text-anchor="start" fill="#202124">PSS 336.5(A 309.4 + B 27.1)</text><rect x="250" y="280" width="608.0899999999999" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="866.0899999999999" y="292" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 715.4</text><text x="30" y="328" font-size="11.5" text-anchor="start" fill="#5f6368">PSS = A + B(smaps_rollup。中央値を別々に取るので 0.3MiB ほどずれる)。cgroup は memory.stat の anon + shmem で、どのプロセスも触っていないページも含む。</text><text x="30" y="348" font-size="11.5" text-anchor="start" fill="#5f6368">8 CPU / 8GB の arm64 コンテナ、3 回の中央値。</text></svg>