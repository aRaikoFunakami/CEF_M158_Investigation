<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="324" fill="#fff"/><text x="30" y="38" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">起動直後の RAM(arm64、テストページを開いて 30 秒後、単位 MiB)</text><rect x="160" y="56" width="14" height="14" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="180" y="68" font-size="13" text-anchor="start" fill="#5f6368">A: 回収できない分のうちプロセスが触ったページ</text><rect x="530" y="56" width="14" height="14" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="550" y="68" font-size="13" text-anchor="start" fill="#5f6368">B: ファイル由来</text><rect x="690" y="56" width="14" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="710" y="68" font-size="13" text-anchor="start" fill="#5f6368">回収できない RAM(cgroup)</text><text x="238" y="116" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250" y="92" width="191.04" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="441.03999999999996" y="92" width="274.44" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="723.48" y="108" font-size="12" text-anchor="start" fill="#202124">PSS 387.6(A 159.2 + B 228.7)</text><rect x="250" y="118" width="192.6" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="450.6" y="130" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 160.5</text><text x="238" y="170" font-size="14" text-anchor="end" fill="#202124">削減版</text><rect x="250" y="146" width="153.0" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="403.0" y="146" width="191.28" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="602.28" y="162" font-size="12" text-anchor="start" fill="#202124">PSS 286.7(A 127.5 + B 159.4)</text><rect x="250" y="172" width="154.56" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="412.56" y="184" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 128.8</text><text x="238" y="224" font-size="14" text-anchor="end" fill="#202124">削減版、SwiftShader なし</text><rect x="250" y="200" width="112.55999999999999" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="362.56" y="200" width="169.2" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="539.76" y="216" font-size="12" text-anchor="start" fill="#202124">PSS 234.7(A 93.8 + B 141.0)</text><rect x="250" y="226" width="122.16" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="380.15999999999997" y="238" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 101.8</text><text x="30" y="274" font-size="11.5" text-anchor="start" fill="#5f6368">PSS = A + B(smaps_rollup。中央値を別々に取るので 0.3MiB ほどずれる)。cgroup は memory.stat の anon + shmem で、どのプロセスも触っていないページも含む。</text><text x="30" y="294" font-size="11.5" text-anchor="start" fill="#5f6368">8 CPU / 8GB の arm64 コンテナ、3 回の中央値。</text></svg>