<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="430" fill="#fff"/><text x="30" y="38" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">Chromium(CEF)のプロセスの分かれ方</text><text x="255" y="78" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">通常(マルチプロセス)</text><rect x="60" y="95" width="390" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="255.0" y="123.0" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">ブラウザプロセス</text><text x="255.0" y="143.0" font-size="12" text-anchor="middle" fill="#5f6368">ウィンドウ、タブ、ネットワークの管理</text><rect x="60" y="185" width="124" height="60" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="122.0" y="213.0" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">レンダラ</text><text x="122.0" y="233.0" font-size="12" text-anchor="middle" fill="#5f6368">ページの処理</text><rect x="193" y="185" width="124" height="60" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="255.0" y="213.0" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">GPU</text><text x="255.0" y="233.0" font-size="12" text-anchor="middle" fill="#5f6368">描画</text><rect x="326" y="185" width="124" height="60" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="388.0" y="213.0" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">ユーティリティ</text><text x="388.0" y="233.0" font-size="12" text-anchor="middle" fill="#5f6368">ネットワーク など</text><rect x="60" y="275" width="390" height="44" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1"/><text x="255.0" y="302.0" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">zygote(子プロセスを作るための待機プロセス)</text><text x="255" y="350" font-size="13" text-anchor="middle" fill="#5f6368">起動直後 8 プロセス。プロセスごとに必要なメモリがある</text><text x="745" y="78" font-size="16" text-anchor="middle" fill="#202124" font-weight="bold">--single-process --no-zygote</text><rect x="550" y="95" width="390" height="224" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1"/><text x="745" y="122" font-size="15" text-anchor="middle" fill="#202124" font-weight="bold">ブラウザプロセス 1 つ</text><rect x="580" y="138" width="330" height="34" rx="6" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="745" y="160" font-size="13.5" text-anchor="middle" fill="#202124">ブラウザの処理</text><rect x="580" y="180" width="330" height="34" rx="6" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="745" y="202" font-size="13.5" text-anchor="middle" fill="#202124">レンダラ(スレッド)</text><rect x="580" y="222" width="330" height="34" rx="6" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="745" y="244" font-size="13.5" text-anchor="middle" fill="#202124">GPU(スレッド)</text><rect x="580" y="264" width="330" height="34" rx="6" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="745" y="286" font-size="13.5" text-anchor="middle" fill="#202124">ユーティリティ(スレッド)</text><text x="745" y="350" font-size="13" text-anchor="middle" fill="#5f6368">1 プロセス。ページの処理が落ちるとブラウザごと落ちる</text><text x="30" y="400" font-size="12.5" text-anchor="start" fill="#5f6368">--enable-low-end-device-mode(低メモリ端末モード)は、プロセスの分け方は変えず、動画の先読み量や JavaScript のメモリ上限を小さくする。</text></svg>