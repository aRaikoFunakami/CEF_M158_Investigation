<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
  </defs>

  <!-- 左: 以前 -->
  <text x="235" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#202124">Alloy ランタイム(2024 年 6 月に削除)</text>
  <text x="235" y="64" font-size="14" text-anchor="middle" fill="#5f6368">CEF が content 層の上に直接載る</text>

  <rect x="60" y="85" width="350" height="54" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="235" y="118" font-size="17" text-anchor="middle" fill="#202124">アプリ(CEF を埋め込む側)</text>
  <rect x="60" y="149" width="350" height="54" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <text x="235" y="182" font-size="17" text-anchor="middle" fill="#202124">CEF API(C / C++ のヘッダ)</text>
  <rect x="60" y="213" width="350" height="54" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <text x="235" y="246" font-size="17" text-anchor="middle" fill="#202124">libcef(CEF 本体)</text>

  <rect x="60" y="393" width="350" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="235" y="421" font-size="17" text-anchor="middle" fill="#202124">content 層</text>
  <text x="235" y="444" font-size="13" text-anchor="middle" fill="#5f6368">プロセス分割、ページ遷移、ブラウザの土台</text>
  <rect x="60" y="467" width="350" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="235" y="495" font-size="17" text-anchor="middle" fill="#202124">Blink / V8 / ネットワーク / 描画 / メディア</text>
  <text x="235" y="518" font-size="13" text-anchor="middle" fill="#5f6368">HTML・CSS の処理、JavaScript の実行など</text>
  <line x1="235" y1="267" x2="235" y2="391" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 右: 現在 -->
  <text x="765" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#202124">Chrome ランタイム(現在の CEF)</text>
  <text x="765" y="64" font-size="14" text-anchor="middle" fill="#5f6368">CEF が chrome 層(Chrome のブラウザ機能)の上に載る</text>

  <rect x="590" y="85" width="350" height="54" rx="8" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="765" y="118" font-size="17" text-anchor="middle" fill="#202124">アプリ(CEF を埋め込む側)</text>
  <rect x="590" y="149" width="350" height="54" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <text x="765" y="182" font-size="17" text-anchor="middle" fill="#202124">CEF API(C / C++ のヘッダ)</text>
  <rect x="590" y="213" width="350" height="54" rx="8" fill="#e6f4ea" stroke="#34a853"/>
  <text x="765" y="246" font-size="17" text-anchor="middle" fill="#202124">libcef(CEF 本体)</text>

  <rect x="590" y="277" width="170" height="44" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="675" y="305" font-size="15" text-anchor="middle" fill="#202124">Alloy スタイル</text>
  <rect x="770" y="277" width="170" height="44" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="855" y="305" font-size="15" text-anchor="middle" fill="#202124">Chrome スタイル</text>

  <rect x="590" y="331" width="350" height="52" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2.5"/>
  <text x="765" y="353" font-size="17" text-anchor="middle" fill="#202124">chrome 層(Chrome のブラウザ機能)</text>
  <text x="765" y="374" font-size="12" text-anchor="middle" fill="#5f6368">プロファイル、自動入力、同期、拡張機能、PDF、UI など</text>

  <rect x="590" y="393" width="350" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="765" y="421" font-size="17" text-anchor="middle" fill="#202124">content 層</text>
  <text x="765" y="444" font-size="13" text-anchor="middle" fill="#5f6368">プロセス分割、ページ遷移、ブラウザの土台</text>
  <rect x="590" y="467" width="350" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="765" y="495" font-size="17" text-anchor="middle" fill="#202124">Blink / V8 / ネットワーク / 描画 / メディア</text>
  <text x="765" y="518" font-size="13" text-anchor="middle" fill="#5f6368">HTML・CSS の処理、JavaScript の実行など</text>

  <text x="500" y="575" font-size="13.5" text-anchor="middle" fill="#5f6368">スタイルはウィンドウの見た目と振る舞いの違いで、どちらも Chrome ランタイムの上で動く。赤枠が今回削る対象の中心。</text>
</svg>
