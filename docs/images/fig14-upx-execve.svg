<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="455" fill="#fff"/><text x="30" y="36" font-size="19" text-anchor="start" fill="#202124" font-weight="bold">execve するプロセスの数と、起動直後の回収できない RAM(arm64、削減版、単位 MiB)</text><rect x="330" y="52" width="14" height="14" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="350" y="64" font-size="13" text-anchor="start" fill="#5f6368">圧縮前</text><rect x="430" y="52" width="14" height="14" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="450" y="64" font-size="13" text-anchor="start" fill="#5f6368">UPX</text><text x="258" y="116" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">起動フラグなし</text><text x="258" y="136" font-size="12" text-anchor="end" fill="#5f6368">execve 4、8 プロセス</text><rect x="270" y="92" width="86.785" height="24" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="364.78499999999997" y="109" font-size="12.5" text-anchor="start" fill="#202124">102.1</text><rect x="270" y="120" width="608.0899999999999" height="24" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="886.0899999999999" y="137" font-size="12.5" text-anchor="start" fill="#202124" font-weight="bold">715.4(+613)</text><text x="270" y="166" font-size="12" text-anchor="start" fill="#5f6368">サンドボックスあり / GPU は別プロセス(失敗時に切り替えられる)</text><text x="258" y="226" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">execve を 2 にするフラグ</text><text x="258" y="246" font-size="12" text-anchor="end" fill="#5f6368">execve 2、5 プロセス</text><rect x="270" y="202" width="64.6" height="24" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="342.6" y="219" font-size="12.5" text-anchor="start" fill="#202124">76.0</text><rect x="270" y="230" width="325.465" height="24" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="603.4649999999999" y="247" font-size="12.5" text-anchor="start" fill="#202124" font-weight="bold">382.9(+307)</text><text x="270" y="276" font-size="12" text-anchor="start" fill="#5f6368">サンドボックスあり / GPU はブラウザ内(切り替えなし)</text><text x="258" y="336" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">3 フラグ</text><text x="258" y="356" font-size="12" text-anchor="end" fill="#5f6368">execve 1、1 プロセス</text><rect x="270" y="312" width="48.195" height="24" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="326.195" y="329" font-size="12.5" text-anchor="start" fill="#202124">56.7</text><rect x="270" y="340" width="178.5" height="24" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="456.5" y="357" font-size="12.5" text-anchor="start" fill="#202124" font-weight="bold">210.0(+153)</text><text x="270" y="386" font-size="12" text-anchor="start" fill="#5f6368">サンドボックスなし / GPU はブラウザ内(切り替えなし)</text><text x="30" y="420" font-size="11.5" text-anchor="start" fill="#5f6368">execve を 2 にするフラグ: --in-process-gpu --no-unsandboxed-zygote --enable-features=NetworkServiceInProcess2。</text><text x="30" y="440" font-size="11.5" text-anchor="start" fill="#5f6368">GPU デバイスがないので 2 つ目と 3 つ目は --disable-gpu 付き。3 回の中央値。logs/483、512。</text></svg>