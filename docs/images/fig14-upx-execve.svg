<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="535" fill="#fff"/><text x="30" y="36" font-size="19" text-anchor="start" fill="#202124" font-weight="bold">execve するプロセスの数と、起動直後の回収できない RAM(arm64、単位 MiB)</text><rect x="250" y="52" width="14" height="14" rx="0" fill="#1a73e8" stroke="none" stroke-width="1"/><text x="270" y="64" font-size="13" text-anchor="start" fill="#5f6368">CEF 既定</text><rect x="380" y="52" width="14" height="14" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="400" y="64" font-size="13" text-anchor="start" fill="#5f6368">削減版(圧縮前)</text><rect x="560" y="52" width="14" height="14" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="580" y="64" font-size="13" text-anchor="start" fill="#5f6368">削減版 + UPX</text><text x="258" y="126" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">起動フラグなし</text><text x="258" y="146" font-size="12" text-anchor="end" fill="#5f6368">execve 4、8 プロセス</text><rect x="270" y="92" width="136.42499999999998" height="22" rx="0" fill="#1a73e8" stroke="none" stroke-width="1"/><text x="414.42499999999995" y="108" font-size="12.5" text-anchor="start" fill="#202124">160.5</text><rect x="270" y="118" width="86.785" height="22" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="364.78499999999997" y="134" font-size="12.5" text-anchor="start" fill="#202124">102.1</text><rect x="270" y="144" width="608.0899999999999" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="886.0899999999999" y="160" font-size="12.5" text-anchor="start" fill="#202124" font-weight="bold">715.4(圧縮前から +613)</text><text x="270" y="188" font-size="12" text-anchor="start" fill="#5f6368">サンドボックスあり / GPU は別プロセス(失敗時に切り替えられる)</text><text x="258" y="261" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">execve を 2 にするフラグ</text><text x="258" y="281" font-size="12" text-anchor="end" fill="#5f6368">execve 2、5 プロセス</text><rect x="270" y="227" width="74.8" height="22" rx="0" fill="#1a73e8" stroke="none" stroke-width="1"/><text x="352.8" y="243" font-size="12.5" text-anchor="start" fill="#202124">88.0</text><rect x="270" y="253" width="64.6" height="22" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="342.6" y="269" font-size="12.5" text-anchor="start" fill="#202124">76.0</text><rect x="270" y="279" width="325.465" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="603.4649999999999" y="295" font-size="12.5" text-anchor="start" fill="#202124" font-weight="bold">382.9(圧縮前から +307)</text><text x="270" y="323" font-size="12" text-anchor="start" fill="#5f6368">サンドボックスあり / GPU はブラウザ内(切り替えなし)</text><text x="258" y="396" font-size="15" text-anchor="end" fill="#202124" font-weight="bold">3 フラグ</text><text x="258" y="416" font-size="12" text-anchor="end" fill="#5f6368">execve 1、1 プロセス</text><rect x="270" y="362" width="55.845" height="22" rx="0" fill="#1a73e8" stroke="none" stroke-width="1"/><text x="333.845" y="378" font-size="12.5" text-anchor="start" fill="#202124">65.7</text><rect x="270" y="388" width="48.195" height="22" rx="0" fill="#9aa0a6" stroke="none" stroke-width="1"/><text x="326.195" y="404" font-size="12.5" text-anchor="start" fill="#202124">56.7</text><rect x="270" y="414" width="178.5" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="456.5" y="430" font-size="12.5" text-anchor="start" fill="#202124" font-weight="bold">210.0(圧縮前から +153)</text><text x="270" y="458" font-size="12" text-anchor="start" fill="#5f6368">サンドボックスなし / GPU はブラウザ内(切り替えなし)</text><text x="30" y="500" font-size="11.5" text-anchor="start" fill="#5f6368">execve を 2 にするフラグ: --in-process-gpu --no-unsandboxed-zygote --enable-features=NetworkServiceInProcess2。</text><text x="30" y="520" font-size="11.5" text-anchor="start" fill="#5f6368">GPU デバイスがないので 2 つ目と 3 つ目は --disable-gpu 付き。3 回の中央値。logs/428、483、512、514。CEF 既定は UPX で圧縮していない。</text></svg>