<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="544" viewBox="0 0 1000 544" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="544" fill="#fff"/><text x="30" y="38" font-size="20" text-anchor="start" fill="#202124" font-weight="bold">AV1 4K60 再生中の RAM(arm64、単位 MiB)</text><rect x="160" y="56" width="14" height="14" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="180" y="68" font-size="13" text-anchor="start" fill="#5f6368">A: 回収できない分のうちプロセスが触ったページ</text><rect x="530" y="56" width="14" height="14" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="550" y="68" font-size="13" text-anchor="start" fill="#5f6368">B: ファイル由来</text><rect x="690" y="56" width="14" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="710" y="68" font-size="13" text-anchor="start" fill="#5f6368">回収できない RAM(cgroup)</text><text x="30" y="106" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">起動フラグなし</text><text x="238" y="140" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250" y="116" width="413.29200000000003" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="663.292" y="116" width="84.84300000000002" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="756.135" y="132" font-size="12" text-anchor="start" fill="#202124">PSS 1,509.5(A 1,252.4 + B 257.1)</text><rect x="250" y="142" width="413.358" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="671.358" y="154" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 1,252.6</text><text x="238" y="194" font-size="14" text-anchor="end" fill="#202124">削減版</text><rect x="250" y="170" width="328.87800000000004" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="578.878" y="170" width="53.955000000000005" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="640.833" y="186" font-size="12" text-anchor="start" fill="#202124">PSS 1,160.1(A 996.6 + B 163.5)</text><rect x="250" y="196" width="331.51800000000003" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="589.518" y="208" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 1,004.6</text><text x="238" y="248" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版 + UPX</text><rect x="250" y="224" width="414.15000000000003" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="664.1500000000001" y="224" width="10.593000000000002" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="682.7429999999999" y="240" font-size="12" text-anchor="start" fill="#202124">PSS 1,287.1(A 1,255.0 + B 32.1)</text><rect x="250" y="250" width="582.351" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="840.351" y="262" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 1,764.7</text><text x="30" y="302" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">3 フラグ</text><text x="238" y="336" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250" y="312" width="360.82200000000006" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="610.8220000000001" y="312" width="84.24900000000001" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="703.071" y="328" font-size="12" text-anchor="start" fill="#202124">PSS 1,348.7(A 1,093.4 + B 255.3)</text><rect x="250" y="338" width="361.185" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="619.185" y="350" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 1,094.5</text><text x="238" y="390" font-size="14" text-anchor="end" fill="#202124">削減版</text><rect x="250" y="366" width="283.60200000000003" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="533.6020000000001" y="366" width="54.186" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="595.788" y="382" font-size="12" text-anchor="start" fill="#202124">PSS 1,023.7(A 859.4 + B 164.2)</text><rect x="250" y="392" width="286.50600000000003" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="544.5060000000001" y="404" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 868.2</text><text x="238" y="444" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">削減版 + UPX</text><rect x="250" y="420" width="320.232" height="22" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="570.232" y="420" width="9.603000000000002" height="22" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="587.835" y="436" font-size="12" text-anchor="start" fill="#202124">PSS 999.5(A 970.4 + B 29.1)</text><rect x="250" y="446" width="329.043" height="14" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="587.043" y="458" font-size="12" text-anchor="start" fill="#a50e0e" font-weight="bold">cgroup 997.1</text><text x="30" y="494" font-size="11.5" text-anchor="start" fill="#5f6368">UPX では、展開したコードのうちプロセスが触っていない部分が cgroup にだけ入るので、cgroup が PSS を超える。</text><text x="30" y="514" font-size="11.5" text-anchor="start" fill="#5f6368">最後まで再生できた 2 回の中央値。CEF 既定は SwiftShader で描画、削減版の 3 フラグは --disable-gpu。</text></svg>