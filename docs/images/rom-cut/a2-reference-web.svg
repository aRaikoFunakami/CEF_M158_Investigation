<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1f2328">
<rect width="1000" height="600" fill="#ffffff"/>
<text x="40.0" y="34.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="bold">chrome 層の相互参照(入口を 1 本切っても、ほかの経路から届く)</text>
<text x="40.0" y="58.0" font-size="13" text-anchor="start" fill="#59636e" font-weight="normal">content の委譲クラス 6 系統 785 関数を空にした状態で、リンカの --why-live を取ると、生き残りは 1,500〜1,900 段の鎖でつながっていた</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c78a8"/></marker></defs>
<rect x="350" y="96" width="630" height="404" rx="18" fill="#fff7f8" stroke="#d1495b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="368.0" y="122.0" font-size="14" text-anchor="start" fill="#d1495b" font-weight="bold">chrome 層(chrome/ + chrome/ からしか届かない部品 51.5MB)</text>
<line x1="614.7" y1="175.0" x2="745.5" y2="175.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="828.0" y1="197.0" x2="852.0" y2="263.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="848.5" y1="307.0" x2="811.5" y2="378.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="704.0" y1="422.0" x2="656.0" y2="433.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="539.2" y1="433.0" x2="490.8" y2="382.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="467.7" y1="338.0" x2="462.3" y2="287.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="472.2" y1="243.0" x2="497.8" y2="197.0" stroke="#59636e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="409.3" y="157.0" width="201.4" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="510.0" y="180.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">Navigate / NavigateImpl</text>
<rect x="749.5" y="157.0" width="141.1" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="820.0" y="180.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">Browser::Create</text>
<rect x="766.8" y="267.0" width="186.3" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="860.0" y="290.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">BrowserView / TabView</text>
<rect x="686.3" y="382.0" width="227.4" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="800.0" y="405.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">TabFeatures::Init(175 機能)</text>
<rect x="439.1" y="437.0" width="241.7" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="560.0" y="460.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">KeyedService ファクトリ 450 個</text>
<rect x="358.0" y="342.0" width="224.0" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="470.0" y="365.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">Autocomplete / Lens / glic</text>
<rect x="393.2" y="247.0" width="133.6" height="36" rx="18" fill="#fde8ea" stroke="#d1495b" stroke-width="1.5"/>
<text x="460.0" y="270.0" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="normal">DevToolsWindow</text>
<text x="665.0" y="300.0" font-size="12" text-anchor="middle" fill="#59636e" font-weight="normal">どの矢印も</text>
<text x="665.0" y="316.0" font-size="12" text-anchor="middle" fill="#59636e" font-weight="normal">関数呼び出しか vtable</text>
<rect x="20" y="126" width="300" height="48" rx="6" fill="#eef3f8" stroke="#4c78a8"/>
<text x="32.0" y="146.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">content → ChromeContentBrowserClient など</text>
<text x="32.0" y="164.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">委譲クラス(vtable 経由で呼ばれる)</text>
<line x1="322" y1="150" x2="348" y2="150" stroke="#4c78a8" stroke-width="1.8" marker-end="url(#ab)"/>
<rect x="20" y="216" width="300" height="48" rx="6" fill="#eef3f8" stroke="#4c78a8"/>
<text x="32.0" y="236.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">CEF → AlloyTabInterface</text>
<text x="32.0" y="254.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">TabFeatures を作る。Alloy でも通る</text>
<line x1="322" y1="240" x2="348" y2="240" stroke="#4c78a8" stroke-width="1.8" marker-end="url(#ab)"/>
<rect x="20" y="306" width="300" height="48" rx="6" fill="#eef3f8" stroke="#4c78a8"/>
<text x="32.0" y="326.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">CEF → ChromeBrowserHostImpl など</text>
<text x="32.0" y="344.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">Chrome スタイル用。Alloy では通らない</text>
<line x1="322" y1="330" x2="348" y2="330" stroke="#4c78a8" stroke-width="1.8" marker-end="url(#ab)"/>
<rect x="20" y="396" width="300" height="48" rx="6" fill="#eef3f8" stroke="#4c78a8"/>
<text x="32.0" y="416.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">CEF → ChromeMainDelegate など</text>
<text x="32.0" y="434.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">g_browser_process、Profile</text>
<line x1="322" y1="420" x2="348" y2="420" stroke="#4c78a8" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="20.0" y="490.0" font-size="12" text-anchor="start" fill="#4c78a8" font-weight="normal">chrome/ の外から入る参照元 14,330 ノード</text>
<text x="20.0" y="506.0" font-size="12" text-anchor="start" fill="#4c78a8" font-weight="normal">(うち CEF は 173。大半は委譲クラスの vtable)</text>
<text x="40.0" y="548.0" font-size="12" text-anchor="start" fill="#59636e" font-weight="normal">鎖の例(1,853 段): TabStripModel ← TabView の生成 ← CefViewView::AddedToWidget ← ChromeBrowserHostImpl::CreateBrowser</text>
<text x="40.0" y="566.0" font-size="12" text-anchor="start" fill="#59636e" font-weight="normal">　← ChromeBrowserDelegate::CreateDevToolsBrowser ← DevToolsWindow の vtable ← …。glic などもファクトリ経由で同じ塊につながる。</text>
</svg>
