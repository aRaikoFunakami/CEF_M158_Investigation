1"/><text x="457.6" y="186.0" font-size="12" text-anchor="start" fill="#202124">PSS 234.8(A 93.8 + B 141.0)</text><rect x="250.0" y="196.0" width="86.4" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="344.4" y="208.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 101.6</text><text x="238.0" y="248.0" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">今回の削減版</text><rect x="250.0" y="224.0" width="65.4" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="315.4" y="224.0" width="97.8" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="421.1" y="240.0" font-size="12" text-anchor="start" fill="#202124">PSS 191.9(A 76.9 + B 115.0)</text><rect x="250.0" y="250.0" width="72.2" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="330.2" y="262.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 84.9</text><text x="30.0" y="302.0" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">3 フラグ(--disable-gpu 付き)</text><text x="238.0" y="336.0" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250.0" y="312.0" width="49.3" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="299.3" y="312.0" width="177.0" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="484.3" y="328.0" font-size="12" text-anchor="start" fill="#202124">PSS 266.1(A 58.0 + B 208.2)</text><rect x="250.0" y="338.0" width="55.8" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="313.8" y="350.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 65.7</text><text x="238.0" y="390.0" font-size="14" text-anchor="end" fill="#202124">前回の削減版</text><rect x="250.0" y="366.0" width="41.6" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="291.6" y="366.0" width="118.5" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="418.1" y="382.0" font-size="12" text-anchor="start" fill="#202124">PSS 188.4(A 49.0 + B 139.4)</text><rect x="250.0" y="392.0" width="48.3" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="306.3" y="404.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 56.8</text><text x="238.0" y="444.0" font-size="14" text-anchor="end" fill="#202124">前回の削減版 + UPX</text><rect x="250.0" y="420.0" width="138.5" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="388.5" y="420.0" width="21.6" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="418.1" y="436.0" font-size="12" text-anchor="start" fill="#202124">PSS 188.4(A 163.0 + B 25.4)</text><rect x="250.0" y="446.0" width="178.8" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="436.8" y="458.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 210.3</text><text x="238.0" y="498.0" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">今回の削減版</text><rect x="250.0" y="474.0" width="34.1" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="284.1" y="474.0" width="96.5" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="388.6" y="490.0" font-size="12" text-anchor="start" fill="#202124">PSS 153.6(A 40.1 + B 113.5)</text><rect x="250.0" y="500.0" width="38.9" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="296.9" y="512.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 45.8</text><text x="238.0" y="552.0" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">今回の削減版 + UPX</text><rect x="250.0" y="528.0" width="113.8" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="363.8" y="528.0" width="16.6" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="388.4" y="544.0" font-size="12" text-anchor="start" fill="#202124">PSS 153.4(A 133.9 + B 19.5)</text><rect x="250.0" y="554.0" width="147.8" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="405.8" y="566.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 173.9</text><text x="30.0" y="602.0" font-size="11.5" text-anchor="start" fill="#5f6368">CEF 既定の 2 行は前回の記事の値。ほかの 7 行は同じ日に続けて測った(今回の削減版は修正前の版)。UPX 版は 3 フラグだけを載せる。</text><text x="30.0" y="622.0" font-size="11.5" text-anchor="start" fill="#5f6368">3 回の中央値。A は PSS − B。B は Pss_File。cgroup は memory.stat の anon + shmem。8 CPU / 8GB の arm64 コンテナ。</text></svg>