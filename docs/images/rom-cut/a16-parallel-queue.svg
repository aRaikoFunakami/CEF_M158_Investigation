<text x="450.0" y="124.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">todo/</text>
<text x="450.0" y="140.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">配る前の仕事</text>
<text x="450.0" y="156.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">(98〜148 個)</text>
<rect x="650.0" y="104.0" width="170.0" height="66.0" fill="#fff7e6" rx="6" stroke="#c9d1d9"/>
<text x="660.0" y="124.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">doing/</text>
<text x="660.0" y="140.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">空いた台が mv で</text>
<text x="660.0" y="156.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">1 つ取る</text>
