<text x="40.0" y="34.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="bold">12 台で並列に流す: 最初に 12 等分する方法と、キューで配る方法</text>
<text x="40.0" y="58.0" font-size="12.5" text-anchor="start" fill="#59636e" font-weight="normal">今回の削減版の UPX 版に同じ 8,290 URL を、2 CPU / 8GB のコンテナ 12 台で流したときの、台ごとの実際の時間</text>
<text x="40.0" y="92.0" font-size="14" text-anchor="start" fill="#1f2328" font-weight="bold">キューで配るしくみ</text>
<rect x="40.0" y="104.0" width="140.0" height="66.0" fill="#eef1f4" rx="6" stroke="#c9d1d9"/>
<text x="50.0" y="124.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">URL の一覧</text>
<text x="50.0" y="140.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">8,290 URL</text>
<rect x="230.0" y="104.0" width="170.0" height="66.0" fill="#eef1f4" rx="6" stroke="#c9d1d9"/>
<text x="240.0" y="124.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">ブロックに分ける</text>
<text x="240.0" y="140.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">見込み約 3 分ずつ、</text>
<text x="240.0" y="156.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">長い順に並べる</text>
