<text x="40.0" y="766.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">棒の 1 区切りが 1 つの仕事(ブロック)。どの台も 24〜27 分で終わる。上の段の 12 等分では、時間切れの多い URL が集まった台が 37 分かかった。</text>
<text x="40.0" y="784.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">12 台の割り当ては合計 24 CPU だが、実際の CPU の使用は 4 コア分ほど。テストの大半は、ページの応答や時間切れを待っている。</text>
