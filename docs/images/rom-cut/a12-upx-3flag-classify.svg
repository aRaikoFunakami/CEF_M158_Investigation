<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1f2328">
<rect width="1000" height="500" fill="#ffffff"/>
<text x="40.0" y="34.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="bold">UPX 版を 3 フラグで動かした WPT の結果の分類(今回の削減版 M23-40 の UPX 版、8,290 URL)</text>
<text x="40.0" y="58.0" font-size="12.5" text-anchor="start" fill="#59636e" font-weight="normal">同じ版のフラグなしと URL ごとに比べた。違った 15 URL は、CEF 既定(3 フラグ)、今回の削減版(3 フラグ、フラグなし)で 3 回ずつ流し直した</text>
<rect x="40.0" y="222.0" width="120.0" height="56.0" fill="#eef1f4" rx="6"/>
<text x="50.0" y="247.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">8,290 URL</text>
<text x="50.0" y="263.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">testharness.js</text>
<rect x="190.0" y="110.0" width="170.0" height="48.0" fill="#eef1f4" rx="6"/>
<text x="200.0" y="131.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">8,275</text>
<text x="200.0" y="147.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">フラグなしと同じ</text>
<rect x="190.0" y="222.0" width="170.0" height="56.0" fill="#eef1f4" rx="6"/>
<text x="200.0" y="247.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">15</text>
<text x="200.0" y="263.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">フラグなしと違う</text>
<path d="M160.0,250.0 H175.0 V134.0 H190.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<path d="M160.0,250.0 H175.0 V250.0 H190.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="395.0" y="95.0" width="235.0" height="64.0" fill="#eef1f4" rx="6"/>
<text x="405.0" y="116.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">8 フレーキーテスト</text>
<text x="405.0" y="132.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">フラグなしでも CEF 既定でも</text>
<text x="405.0" y="148.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">回によって結果が変わる</text>
<path d="M360.0,250.0 H377.5 V127.0 H395.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="395.0" y="205.0" width="235.0" height="64.0" fill="#fdecc8" rx="6"/>
<text x="405.0" y="226.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">1 ブラウザごと落ちる</text>
<text x="405.0" y="242.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">IndexedDB/interleaved-cursors-small</text>
<text x="405.0" y="258.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">最初の回と同じ順なら毎回落ちる</text>
<path d="M360.0,250.0 H377.5 V237.0 H395.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="395.0" y="330.0" width="235.0" height="48.0" fill="#fdecc8" rx="6"/>
<text x="405.0" y="351.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">6 3 フラグでは毎回失敗</text>
<text x="405.0" y="367.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">CEF 既定でも同じ</text>
<path d="M360.0,250.0 H377.5 V354.0 H395.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="665.0" y="190.0" width="315.0" height="64.0" fill="#fdecc8" rx="6"/>
<text x="675.0" y="211.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">JavaScript のヒープの OOM</text>
<text x="675.0" y="227.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">ヒープの上限が約 3.76GB → 約 286MB</text>
<text x="675.0" y="243.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">前のページのヒープが残る(推定)</text>
<path d="M630.0,237.0 H647.5 V222.0 H665.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="665.0" y="264.0" width="315.0" height="48.0" fill="#fdecc8" rx="6"/>
<text x="675.0" y="285.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">CEF 既定を含む 4 版で 20 回中 20 回</text>
<text x="675.0" y="301.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">low-end を外すか BFCache を止めると落ちない</text>
<path d="M630.0,237.0 H647.5 V288.0 H665.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="665.0" y="322.0" width="315.0" height="48.0" fill="#fdecc8" rx="6"/>
<text x="675.0" y="343.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">remote-playback 5</text>
<text x="675.0" y="359.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">watchAvailability() のコールバックが来ない</text>
<path d="M630.0,354.0 H647.5 V346.0 H665.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<rect x="665.0" y="380.0" width="315.0" height="48.0" fill="#fdecc8" rx="6"/>
<text x="675.0" y="401.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">media-source/waiting-for-audio 1</text>
<text x="675.0" y="417.0" font-size="11.5" text-anchor="start" fill="#1f2328" font-weight="normal">SourceBuffer がいっぱい(QuotaExceededError)</text>
<path d="M630.0,354.0 H647.5 V404.0 H665.0" fill="none" stroke="#8c959f" stroke-width="1.4"/>
<text x="665.0" y="452.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">6 件とも --enable-low-end-device-mode だけで失敗する</text>
<rect x="40.0" y="472.0" width="14.0" height="14.0" fill="#fdecc8" />
<text x="60.0" y="484.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">低メモリ端末モードの制約(CEF 既定でも起きる)</text>
<rect x="370.0" y="472.0" width="14.0" height="14.0" fill="#eef1f4" />
<text x="390.0" y="484.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">そのほか</text>
<text x="500.0" y="484.0" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="bold">ROM の削減や UPX による予定外の差は 0 件</text>
</svg>
