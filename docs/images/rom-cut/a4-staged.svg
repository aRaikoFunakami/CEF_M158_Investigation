<text x="307.5" y="101.9" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold">約 180MB</text>
<text x="307.5" y="116.9" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="normal">−6.0</text>
<text x="307.5" y="420.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">① タブ機能と</text>
