<text x="82.0" y="94.0" font-size="11" text-anchor="end" fill="#59636e" font-weight="normal">190MB</text>
<rect x="121.9" y="103.1" width="81.2" height="296.9" fill="#9aa5b1" />
<text x="162.5" y="81.1" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold">186.19MB</text>
<text x="162.5" y="420.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">出発点</text>
<text x="162.5" y="454.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">前回の削減版</text>
