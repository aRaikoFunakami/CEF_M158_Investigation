<text x="452.5" y="436.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">約 350 個を作らない</text>
<text x="452.5" y="454.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">571 関数</text>
<rect x="556.9" y="178.1" width="81.2" height="221.9" fill="#2a9d8f" />
<text x="597.5" y="156.1" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold">164.43MB</text>
<text x="597.5" y="171.1" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="normal">−21.8</text>
