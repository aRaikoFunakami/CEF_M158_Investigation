<text x="742.5" y="243.2" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold">139.14MB</text>
<text x="742.5" y="258.2" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="normal">−47.1</text>
