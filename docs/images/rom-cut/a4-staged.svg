<text x="597.5" y="436.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">を作らない</text>
<text x="597.5" y="454.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">1,912 関数</text>
