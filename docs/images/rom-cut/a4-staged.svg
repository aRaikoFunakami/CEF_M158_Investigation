<text x="742.5" y="436.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">委譲クラスを全部</text>
<text x="742.5" y="454.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">2,596 関数</text>
<rect x="846.9" y="291.2" width="81.2" height="108.8" fill="#c9d3d1" />
<text x="887.5" y="269.2" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="bold">131.60MB</text>
<text x="887.5" y="284.2" font-size="12" text-anchor="middle" fill="#d1495b" font-weight="normal">−54.6</text>
<text x="887.5" y="420.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">下限: chrome/ の</text>
<text x="887.5" y="436.0" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="normal">関数をすべて空に</text>
<text x="887.5" y="454.0" font-size="11" text-anchor="middle" fill="#59636e" font-weight="normal">91,201 関数</text>
<text x="40.0" y="504.0" font-size="12" text-anchor="start" fill="#59636e" font-weight="normal">どれも関数を空にしたリンクでの計測で、起動はしていない。</text>
</svg>
