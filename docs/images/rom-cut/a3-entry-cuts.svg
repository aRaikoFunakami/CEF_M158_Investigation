<text x="40.0" y="34.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="bold">content からの入口を空にしたときの減り方(委譲クラス 6 系統 −14.3MB、chrome 層全体 −54.6MB)</text>
<text x="40.0" y="58.0" font-size="13" text-anchor="start" fill="#59636e" font-weight="normal">関数を空の関数に差し替えて(--defsym)リンクだけやり直し、strip 後のサイズの減少を測った(実リンク、基準 186.19MB)</text>
