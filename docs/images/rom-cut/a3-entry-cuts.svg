<text x="320.0" y="359.0" font-size="11" text-anchor="end" fill="#59636e" font-weight="normal">91,201 関数</text>
<rect x="330.0" y="336.0" width="545.9" height="22.0" fill="#d1495b" />
<text x="881.9" y="351.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="bold">−54.59MB</text>
<text x="40.0" y="410.0" font-size="12" text-anchor="start" fill="#59636e" font-weight="normal">委譲クラス 6 系統を空にしても残ったもの: chrome/browser 13.5MB、autofill 2.8MB、omnibox、sync など。</text>
