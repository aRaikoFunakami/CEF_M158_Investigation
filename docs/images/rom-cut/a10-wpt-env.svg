<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif" font-size="13" fill="#1f2328">
<rect width="1000" height="760" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<text x="40.0" y="34.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="bold">WPT の実行環境: どこに何を置き、どこで流し、結果をどう集めたか</text>
<text x="40.0" y="58.0" font-size="12.5" text-anchor="start" fill="#59636e" font-weight="normal">①〜⑥ は処理の順番。Mac とコンテナは同じ Mac Studio の上で動く</text>
<rect x="30.0" y="75.0" width="400.0" height="670.0" fill="#fafbfc" rx="10" stroke="#8c959f"/>
<text x="46.0" y="100.0" font-size="15" text-anchor="start" fill="#1f2328" font-weight="bold">Mac(ホスト、macOS)</text>
<rect x="46.0" y="115.0" width="368.0" height="345.0" fill="#fff7e6" rx="8" stroke="#d4a72c"/>
<text x="58.0" y="137.0" font-size="13.5" text-anchor="start" fill="#1f2328" font-weight="bold">共有ディレクトリ a64/fp</text>
<text x="58.0" y="155.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">各コンテナの /mnt/fp にマウントする</text>
<rect x="60.0" y="170.0" width="340.0" height="52.0" fill="#ffffff" rx="6" stroke="#c9d1d9"/>
<text x="70.0" y="190.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">builds/&lt;版&gt;/</text>
<text x="70.0" y="206.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">配布物(cefsimple、libcef.so、pak など)</text>
<rect x="60.0" y="238.0" width="340.0" height="52.0" fill="#ffffff" rx="6" stroke="#c9d1d9"/>
<text x="70.0" y="258.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">wpt/</text>
<text x="70.0" y="274.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">WPT のテスト(571MB)、道具、MANIFEST.json</text>
<rect x="60.0" y="306.0" width="340.0" height="52.0" fill="#ffffff" rx="6" stroke="#c9d1d9"/>
<text x="70.0" y="326.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">queue/&lt;回&gt;/todo/</text>
<text x="70.0" y="342.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">仕事 = URL のブロック(約 3 分ずつ)× 版</text>
<rect x="60.0" y="374.0" width="340.0" height="70.0" fill="#ffffff" rx="6" stroke="#c9d1d9"/>
<text x="70.0" y="394.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">results/</text>
<text x="70.0" y="410.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">結果の JSON(URL ごとの判定とサブテスト)、</text>
<text x="70.0" y="426.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">ブラウザと wpt serve のログ</text>
<rect x="46.0" y="480.0" width="368.0" height="70.0" fill="#eef1f4" rx="6" stroke="#c9d1d9"/>
<text x="56.0" y="500.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">① mklist.py、mkqueue.py</text>
<text x="56.0" y="516.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">MANIFEST.json から URL を展開し、</text>
<text x="56.0" y="532.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">ブロックに分けて queue/ に置く</text>
<rect x="46.0" y="566.0" width="368.0" height="52.0" fill="#eef1f4" rx="6" stroke="#c9d1d9"/>
<text x="56.0" y="586.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">② run-queue.sh</text>
<text x="56.0" y="602.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">コンテナを 12 台立て、仕事を配る</text>
<rect x="46.0" y="634.0" width="368.0" height="96.0" fill="#eef1f4" rx="6" stroke="#c9d1d9"/>
<text x="56.0" y="654.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">⑥ compare.py、classify.py</text>
<text x="56.0" y="670.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">版ごとの結果を URL ごとに横に並べ、</text>
<text x="56.0" y="686.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">A(CEF 既定)と違う URL を出す。</text>
<text x="56.0" y="702.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">回をまたいで重ね、フレーキーを外して分類する</text>
<rect x="536.0" y="59.0" width="440.0" height="670.0" fill="#f3f7fb" rx="10" stroke="#8c959f"/>
<rect x="528.0" y="67.0" width="440.0" height="670.0" fill="#f3f7fb" rx="10" stroke="#8c959f"/>
<rect x="520.0" y="75.0" width="440.0" height="670.0" fill="#f8fbff" rx="10" stroke="#57606a"/>
<text x="536.0" y="100.0" font-size="15" text-anchor="start" fill="#1f2328" font-weight="bold">arm64 のコンテナ × 12</text>
<text x="536.0" y="118.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">各 2 CPU / 8GB、Ubuntu 24.04、Apple の container</text>
<rect x="536.0" y="170.0" width="380.0" height="52.0" fill="#e8f1fa" rx="6" stroke="#c9d1d9"/>
<text x="546.0" y="190.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">③ /root/fp/builds/&lt;版&gt;/</text>
<text x="546.0" y="206.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">配布物をコンテナのローカルディスクにコピー</text>
<rect x="536.0" y="238.0" width="380.0" height="70.0" fill="#e8f1fa" rx="6" stroke="#c9d1d9"/>
<text x="546.0" y="258.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">③ wpt serve(wptserve.sh)</text>
<text x="546.0" y="274.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">http 8081/8082、https 8444/8445、ws 8091、wss 8495</text>
<text x="546.0" y="290.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">doc_root = /mnt/fp/wpt/…(マウント越しに読む)</text>
<rect x="536.0" y="330.0" width="380.0" height="70.0" fill="#e8f1fa" rx="6" stroke="#c9d1d9"/>
<text x="546.0" y="350.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">④ 実行ツール wptcdp.py</text>
<text x="546.0" y="366.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">仕事を 1 つ取り、ブラウザを起動して</text>
<text x="546.0" y="382.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">URL を 1 つずつ開かせ、判定を読み取る</text>
<rect x="536.0" y="470.0" width="380.0" height="86.0" fill="#e8f1fa" rx="6" stroke="#c9d1d9"/>
<text x="546.0" y="490.0" font-size="13" text-anchor="start" fill="#1f2328" font-weight="bold">④ cefsimple(Alloy スタイル)</text>
<text x="546.0" y="506.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">Xvfb :1 + openbox の上で動く</text>
<text x="546.0" y="522.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">--host-resolver-rules で web-platform.test などを</text>
<text x="546.0" y="538.0" font-size="11.5" text-anchor="start" fill="#59636e" font-weight="normal">127.0.0.1(同じコンテナ)に向ける</text>
<path d="M400.0,196.0 L536.0,196.0" fill="none" stroke="#57606a" stroke-width="1.6"/>
<path d="M536.0,196.0 L526.0,191.0 L526.0,201.0 z" fill="#57606a"/>
<text x="440.0" y="188.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">③ コピー</text>
<path d="M400.0,264.0 L536.0,270.0" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M536.0,270.0 L526.2,264.6 L525.8,274.6 z" fill="#57606a"/>
<text x="440.0" y="258.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">マウント</text>
<path d="M400.0,332.0 L536.0,352.0" fill="none" stroke="#57606a" stroke-width="1.6"/>
<path d="M536.0,352.0 L526.8,345.6 L525.4,355.5 z" fill="#57606a"/>
<text x="432.0" y="330.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">mv で 1 つ取る</text>
<path d="M620.0,400.0 L620.0,470.0" fill="none" stroke="#57606a" stroke-width="1.6"/>
<path d="M620.0,470.0 L625.0,460.0 L615.0,460.0 z" fill="#57606a"/>
<text x="630.0" y="420.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">CDP(ポート 9222)</text>
<text x="630.0" y="435.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">Page.navigate、</text>
<text x="630.0" y="450.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">結果の読み取り</text>
<path d="M916.0,513.0 L940.0,513.0 L940.0,273.0 L916.0,273.0" fill="none" stroke="#57606a" stroke-width="1.6"/>
<path d="M916.0,273.0 L926.0,278.0 L926.0,268.0 z" fill="#57606a"/>
<text x="932.0" y="420.0" font-size="11.5" text-anchor="end" fill="#24292f" font-weight="normal">④ HTTP で</text>
<text x="932.0" y="435.0" font-size="11.5" text-anchor="end" fill="#24292f" font-weight="normal">テストのページを読む</text>
<text x="932.0" y="450.0" font-size="11.5" text-anchor="end" fill="#24292f" font-weight="normal">(127.0.0.1)</text>
<path d="M536.0,380.0 L470.0,380.0 L470.0,409.0 L400.0,409.0" fill="none" stroke="#57606a" stroke-width="1.6"/>
<path d="M400.0,409.0 L410.0,414.0 L410.0,404.0 z" fill="#57606a"/>
<text x="438.0" y="445.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">⑤ 結果を書く</text>
<path d="M230.0,444.0 L230.0,466.0 L440.0,466.0 L440.0,690.0 L414.0,690.0" fill="none" stroke="#57606a" stroke-width="1.6"/>
<path d="M414.0,690.0 L424.0,695.0 L424.0,685.0 z" fill="#57606a"/>
<text x="446.0" y="600.0" font-size="11.5" text-anchor="start" fill="#24292f" font-weight="normal">集める</text>
<text x="536.0" y="600.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">テストのページは、同じコンテナの wpt serve から読む。</text>
<text x="536.0" y="620.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">(web-platform.test などを 127.0.0.1 に向けた)</text>
<text x="536.0" y="650.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">ブラウザは仕事(ブロック)ごとに起動し直す。</text>
<text x="536.0" y="670.0" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">12 台が同じ todo/ から取り合い、空いた台から次を取る。</text>
</svg>
