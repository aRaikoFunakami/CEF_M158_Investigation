<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="652" viewBox="0 0 1000 652" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"><rect width="1000" height="652" fill="#fff"/><text x="30.0" y="38.0" font-size="19" text-anchor="start" fill="#202124" font-weight="bold">H.264 1080p60 再生中の RAM(arm64、単位 MiB)</text><rect x="160.0" y="56.0" width="14.0" height="14.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><text x="180.0" y="68.0" font-size="13" text-anchor="start" fill="#5f6368">A: 回収できない分のうちプロセスが触ったページ</text><rect x="530.0" y="56.0" width="14.0" height="14.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="550.0" y="68.0" font-size="13" text-anchor="start" fill="#5f6368">B: ファイル由来</text><rect x="690.0" y="56.0" width="14.0" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="710.0" y="68.0" font-size="13" text-anchor="start" fill="#5f6368">回収できない RAM(cgroup)</text><text x="30.0" y="106.0" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">起動フラグなし</text><text x="238.0" y="140.0" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250.0" y="116.0" width="331.7" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="581.7" y="116.0" width="107.4" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="697.2" y="132.0" font-size="12" text-anchor="start" fill="#202124">PSS 1,045.5(A 789.8 + B 255.8)</text><rect x="250.0" y="142.0" width="331.8" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="589.8" y="154.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 790.0</text><text x="238.0" y="194.0" font-size="14" text-anchor="end" fill="#202124">前回の削減版</text><rect x="250.0" y="170.0" width="250.9" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="500.9" y="170.0" width="69.3" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="578.3" y="186.0" font-size="12" text-anchor="start" fill="#202124">PSS 762.5(A 597.5 + B 165.1)</text><rect x="250.0" y="196.0" width="254.3" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="512.3" y="208.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 605.5</text><text x="238.0" y="248.0" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">今回の削減版</text><rect x="250.0" y="224.0" width="235.9" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="485.9" y="224.0" width="60.2" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="554.1" y="240.0" font-size="12" text-anchor="start" fill="#202124">PSS 705.0(A 561.6 + B 143.4)</text><rect x="250.0" y="250.0" width="239.2" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="497.2" y="262.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 569.6</text><text x="30.0" y="302.0" font-size="15" text-anchor="start" fill="#202124" font-weight="bold">3 フラグ</text><text x="238.0" y="336.0" font-size="14" text-anchor="end" fill="#202124">CEF 既定</text><rect x="250.0" y="312.0" width="277.5" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="527.5" y="312.0" width="105.6" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="641.1" y="328.0" font-size="12" text-anchor="start" fill="#202124">PSS 912.2(A 660.7 + B 251.4)</text><rect x="250.0" y="338.0" width="278.0" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="536.0" y="350.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 661.9</text><text x="238.0" y="390.0" font-size="14" text-anchor="end" fill="#202124">前回の削減版</text><rect x="250.0" y="366.0" width="220.3" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="470.3" y="366.0" width="68.8" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="547.0" y="382.0" font-size="12" text-anchor="start" fill="#202124">PSS 688.1(A 524.5 + B 163.7)</text><rect x="250.0" y="392.0" width="224.0" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="482.0" y="404.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 533.4</text><text x="238.0" y="444.0" font-size="14" text-anchor="end" fill="#202124">前回の削減版 + UPX</text><rect x="250.0" y="420.0" width="274.7" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="524.7" y="420.0" width="12.4" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="545.1" y="436.0" font-size="12" text-anchor="start" fill="#202124">PSS 683.7(A 654.0 + B 29.6)</text><rect x="250.0" y="446.0" width="287.1" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="545.1" y="458.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 683.5</text><text x="238.0" y="498.0" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">今回の削減版</text><rect x="250.0" y="474.0" width="217.3" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="467.3" y="474.0" width="58.8" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="534.1" y="490.0" font-size="12" text-anchor="start" fill="#202124">PSS 657.4(A 517.3 + B 140.0)</text><rect x="250.0" y="500.0" width="219.6" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="477.6" y="512.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 522.8</text><text x="238.0" y="552.0" font-size="14" text-anchor="end" fill="#202124" font-weight="bold">今回の削減版 + UPX</text><rect x="250.0" y="528.0" width="267.2" height="22.0" rx="0" fill="#d93025" stroke="none" stroke-width="1"/><rect x="517.2" y="528.0" width="11.7" height="22.0" rx="0" fill="#fbbc04" stroke="none" stroke-width="1"/><text x="536.9" y="544.0" font-size="12" text-anchor="start" fill="#202124">PSS 664.0(A 636.2 + B 27.8)</text><rect x="250.0" y="554.0" width="276.3" height="14.0" rx="0" fill="#fff" stroke="#a50e0e" stroke-width="2"/><text x="534.3" y="566.0" font-size="12" text-anchor="#a50e0e" fill="#202124" font-weight="bold">cgroup 657.9</text><text x="30.0" y="602.0" font-size="11.5" text-anchor="start" fill="#5f6368">CEF 既定の 2 行は前回の記事の値。ほかの 7 行は同じ日に続けて測った(今回の削減版は修正前の版)。UPX 版は 3 フラグだけを載せる。</text><text x="30.0" y="622.0" font-size="11.5" text-anchor="start" fill="#5f6368">最後まで再生できた 2 回の中央値。A は Pss_Anon + Pss_Shmem、B は Pss_File。8 CPU / 8GB の arm64 コンテナ。</text></svg>