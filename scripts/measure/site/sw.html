<!doctype html><meta charset=utf-8><title>sw</title><link rel=stylesheet href=style.css><script src=common.js></script>
<h2 id=h>Service Worker: 実行中</h2><pre id=out></pre>
<script>(async()=>{ const r={pass:false}; try{
  r.hasAPI = 'serviceWorker' in navigator;
  const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
  for (let i=0;i<40 && !navigator.serviceWorker.controller;i++) await sleep(250);
  r.controlled = !!navigator.serviceWorker.controller;
  r.body = await (await fetch('/sw-probe')).text(); r.pass = r.body === 'from-sw';
  const c = await caches.open('t'); await c.put('/x', new Response('cached')); r.cacheAPI = await (await c.match('/x')).text();
}catch(e){ r.error = String(e); } done('Service Worker', r); })();</script>
